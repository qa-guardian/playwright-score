name: Publish to npm

on:
  push:
    branches: [main]
    paths:
      - package.json
  workflow_dispatch:

jobs:
  publish:
    if: github.repository == 'qa-guardian/playwright-score'
    runs-on: ubuntu-latest
    # id-token: write is what lets npm's trusted-publisher OIDC flow work —
    # no NPM_TOKEN secret to store, rotate, or have expire.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # Trusted publishing requires npm CLI >=11.5.1 and Node >=22.14.0.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # actions/setup-node's cached Node 22 build bundles an older npm
      # (seen: 10.9.8) that predates trusted-publisher support and silently
      # falls back to unauthenticated publish (npm then reports a
      # confusing 404 instead of a real auth error). Force a recent npm.
      - run: npm install -g npm@latest

      - run: npm ci

      - run: npm test

      # The package is published under two names from this one source tree:
      # @qaguardian/playwright-score (scoped) and pwscore (unscoped, the name
      # the docs and emails tell people to run). Each name is checked and
      # published on its own, so a re-run (workflow_dispatch) after a partial
      # failure only publishes the name that is still missing. npm versions are
      # immutable, and ordinary pushes to main that do not change the version
      # are no-ops for both names.
      #
      # Both names use the same trusted-publisher OIDC flow: no token. Each
      # package must have this repo + publish.yml configured as its trusted
      # publisher on npmjs.com (Settings > Trusted Publisher), one setting per
      # package.
      - name: Publish @qaguardian/playwright-score
        run: node scripts/publish-name.mjs @qaguardian/playwright-score

      - name: Publish pwscore
        run: node scripts/publish-name.mjs pwscore
