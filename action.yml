name: 'Playwright Spec Score'
description: 'Lint and score Playwright test specs against best-practice rules (deterministic). Posts a job summary and optional PR comment; gates CI on the result.'
author: 'QA Guardian'
branding:
  icon: 'check-circle'
  color: 'green'

inputs:
  paths:
    description: 'Space-separated paths/globs to score (e.g. "tests e2e")'
    required: false
    default: 'tests'
  profile:
    description: 'Scoring profile (standard is the only one)'
    required: false
    default: 'standard'
  threshold:
    description: 'Optional score bar 0-100: the result also fails when the score is below it. Empty (the default) means no score bar; the score is reported and does not gate.'
    required: false
    default: ''
  allow-partial:
    description: 'true: a partial result (a file was skipped) can pass, also one where a limit left nothing scored (score 0; its status is partial). A not-scored result never passes.'
    required: false
    default: 'false'
  max-seconds:
    description: 'Optional time limit for the run in seconds. Files not analysed when it passes are skipped, which makes the result partial. Empty (the default) means no limit.'
    required: false
    default: ''
  mode:
    description: 'warn: report only, never fail the step. gate: fail the step when the result does not pass (see the pass output).'
    required: false
    default: 'gate'
  comment:
    description: 'Post/update a sticky PR comment with the score report (pull_request events only)'
    required: false
    default: 'true'
  version:
    description: 'Version of @qaguardian/playwright-score to run (npm dist-tag or version range)'
    required: false
    default: '3'
  github-token:
    description: 'Token used to post the PR comment. Defaults to the workflow''s GITHUB_TOKEN.'
    required: false
    default: ${{ github.token }}

outputs:
  score:
    description: 'Overall score, 0-100'
    value: ${{ steps.score.outputs.score }}
  grade:
    description: 'Letter grade, A-F'
    value: ${{ steps.score.outputs.grade }}
  pass:
    description: '"true" or "false": true when every file was scored (or the result is partial and allow-partial is true), no finding that lets a test pass whatever the app does was found, and the score meets the threshold when one is given'
    value: ${{ steps.score.outputs.pass }}

runs:
  using: 'composite'
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Run Playwright Spec Score
      id: score
      shell: bash
      env:
        PWS_PATHS: ${{ inputs.paths }}
        PWS_PROFILE: ${{ inputs.profile }}
        PWS_THRESHOLD: ${{ inputs.threshold }}
        PWS_ALLOW_PARTIAL: ${{ inputs.allow-partial }}
        PWS_MAX_SECONDS: ${{ inputs.max-seconds }}
        PWS_VERSION: ${{ inputs.version }}
      run: |
        set -e
        GATE_ARGS=()
        if [ -n "$PWS_THRESHOLD" ]; then
          GATE_ARGS+=(--threshold "$PWS_THRESHOLD")
        fi
        if [ "$PWS_ALLOW_PARTIAL" = "true" ]; then
          GATE_ARGS+=(--allow-partial)
        fi
        if [ -n "$PWS_MAX_SECONDS" ]; then
          GATE_ARGS+=(--max-seconds "$PWS_MAX_SECONDS")
        fi

        # One run writes both reports: JSON for the outputs, markdown for the summary and the comment.
        set +e
        npx --yes -p "@qaguardian/playwright-score@${PWS_VERSION}" playwright-score \
          $PWS_PATHS --profile "$PWS_PROFILE" "${GATE_ARGS[@]}" \
          --format json --out "$RUNNER_TEMP/pw-score.json" \
          --markdown-out "$RUNNER_TEMP/pw-score.md"
        SCORE_EXIT=$?
        set -e

        if [ "$SCORE_EXIT" -eq 2 ]; then
          echo "::error::playwright-score exited with a tool error (exit 2) — see log above"
          exit 2
        fi

        cat "$RUNNER_TEMP/pw-score.md" >> "$GITHUB_STEP_SUMMARY"

        SCORE=$(jq -r '.score' "$RUNNER_TEMP/pw-score.json")
        GRADE=$(jq -r '.grade' "$RUNNER_TEMP/pw-score.json")
        PASS=$(jq -r '.pass' "$RUNNER_TEMP/pw-score.json")
        echo "score=$SCORE" >> "$GITHUB_OUTPUT"
        echo "grade=$GRADE" >> "$GITHUB_OUTPUT"
        echo "pass=$PASS" >> "$GITHUB_OUTPUT"
        echo "Playwright Spec Score: $SCORE/100 ($GRADE) — pass=$PASS"

    - name: Comment on PR
      if: ${{ inputs.comment == 'true' && github.event_name == 'pull_request' }}
      uses: actions/github-script@v7
      env:
        PWS_REPORT_PATH: ${{ runner.temp }}/pw-score.md
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');
          const marker = '<!-- playwright-spec-score-report -->';
          const body = marker + '\n\n' + fs.readFileSync(process.env.PWS_REPORT_PATH, 'utf8');

          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          const existing = comments.find((c) => c.body?.includes(marker));

          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
          }

    - name: Enforce the gate
      if: ${{ inputs.mode == 'gate' }}
      shell: bash
      run: |
        if [ "${{ steps.score.outputs.pass }}" != "true" ]; then
          echo "::error::Playwright Spec Score ${{ steps.score.outputs.score }}/100 (${{ steps.score.outputs.grade }}) did not pass: a test would pass whatever the app does, the result is partial or not scored (a file was skipped, or no tests were found), or the score is below the threshold you set. See the report for details. Set mode: warn to report without failing CI."
          exit 1
        fi
